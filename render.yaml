# Render Blueprint — deploys the public site + TikTok OAuth callback as ONE web service
# on Render's own HTTPS domain (https://<name>.onrender.com). No custom domain required.
#
# This folder is its own git repo / deploy root, so the public site is isolated from the
# book source. See README.md for setup.
#
# PLAN: free — enough for the public site, Terms/Privacy and the OAuth callback (what TikTok's
# app review needs). Free instances have NO persistent disk and cold-start after ~15 min idle,
# so the OAuth token written by the callback is EPHEMERAL. That is fine until we wire real
# automated posting (which is gated behind TikTok's app audit anyway). To make the token durable,
# upgrade this service to `plan: starter` and add a `disk:` mounted at /data, then set
# TIKTOK_STATE_DIR=/data (see README).
services:
  - type: web
    name: dsee-social                # -> https://dsee-social.onrender.com (rename if taken)
    runtime: python
    region: virginia                 # US East
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: TIKTOK_STATE_DIR
        value: /tmp/tiktok-state       # ephemeral on free; change to /data after adding a disk
      # Set these in the Render dashboard (Environment tab) once the TikTok app exists:
      - key: TIKTOK_REDIRECT_URI       # = https://<this-service>.onrender.com/tiktok/callback
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_VERIFY_META        # optional: TikTok domain-verification meta content
        sync: false
